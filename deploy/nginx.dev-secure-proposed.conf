# REVIEW ONLY — merge template for the active DEV server block, not a directly
# installable file. Do not install, test, reload, or merge without a separately
# approved backup and `sudo nginx -t`. This proposal targets the verified
# unified application listener at 127.0.0.1:3001.
#
# Required active-vhost directives to retain during an approved merge:
#   * exact ssl_certificate and ssl_certificate_key lines (not reproduced here);
#   * the existing client_max_body_size 55M setting;
#   * active upstream proxy headers and 120-second read/send timeouts;
#   * any explicit access/error-log, TLS, or global-security includes.
# Current CSP, HSTS, nosniff, frame, and referrer headers originate in the
# application. This proposal preserves those upstream headers; it changes only
# Cache-Control and X-Robots-Tag handling described below.

server {
    listen 80;
    server_name dev.sapsecurityexpert.com;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.sapsecurityexpert.com;

    # REQUIRED MERGE: retain the active ssl_certificate and ssl_certificate_key
    # directives verbatim. Paths are intentionally not invented here.
    client_max_body_size 55M;

    # Content-hashed Next assets may be cached by browsers, but are never placed
    # in an Nginx shared cache. This location must precede the /_next/ fallback.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Repository assets may receive a shorter browser cache. Mutable uploads do
    # not use this location and are never assigned immutable cache semantics.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # All authenticated, stateful, API, payment, download, and upload surfaces
    # are explicit no-store pass-throughs. /uploads/downloads is included by
    # /uploads and remains application-gated.
    location ~ ^/(api|admin|member|uploads)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # DEV safety preference: do not share-cache HTML at all. This removes the
    # connect.sid/cookie-variable ambiguity and preserves upstream no-store.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}

