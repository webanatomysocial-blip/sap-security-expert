# REVIEW ONLY — complete replacement proposal for the active DEV server block.
# Do not install, test, reload, or merge without a separately approved backup
# and `sudo nginx -t`. This proposal targets dev.sapsecurityexpert.com and the
# verified unified application listener at 127.0.0.1:3001.

server {
    listen 80;
    server_name dev.sapsecurityexpert.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.sapsecurityexpert.com;

    # Preserve the existing certificate directives verbatim when merging this
    # proposal; their paths are intentionally not repeated here.
    client_max_body_size 55M;

    # Durable DEV defence in depth. Hide any build-time application value first
    # so there is exactly one X-Robots-Tag response header.
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Content-hashed Next assets may be cached by browsers, but are never placed
    # in an Nginx shared cache. This location must precede the /_next/ fallback.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Repository assets may receive a shorter browser cache. Mutable uploads do
    # not use this location and are never assigned immutable cache semantics.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # All authenticated, stateful, API, payment, download, and upload surfaces
    # are explicit no-store pass-throughs. /uploads/downloads is included by
    # /uploads and remains application-gated.
    location ~ ^/(api|admin|member|uploads)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # DEV safety preference: do not share-cache HTML at all. This removes the
    # connect.sid/cookie-variable ambiguity and preserves upstream no-store.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
}

# Approval-time checks (do not run now):
#   sudo cp /etc/nginx/sites-available/dev.sapsecurityexpert.com \
#     /secure/backup/dev.sapsecurityexpert.com.before-$(date -u +%Y%m%dT%H%M%SZ)
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -I https://dev.sapsecurityexpert.com/
#   curl -I https://dev.sapsecurityexpert.com/_next/static/<known-hash>.js
#   Verify anonymous and authenticated public pages never expose X-Cache-Status
#   HIT and API/member/admin/download responses include no-store.
