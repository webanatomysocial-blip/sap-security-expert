# REVIEW ONLY — do not copy or reload without DEV approval and a backup.
# Include inside the DEV server block after the existing proxy variables.

location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Versioned repository assets are safe for a moderate browser cache. Mutable
# uploads are intentionally excluded because their URLs are not versioned.
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
}

# Sensitive and per-user surfaces are always passed through and never cached.
location ~ ^/(api|admin|member|uploads/downloads)(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}

# Validation: sudo nginx -t
# Backup: sudo cp /etc/nginx/sites-available/<dev-site> /secure/backup/<dev-site>.before-cache
# Rollback: restore that exact backup, run sudo nginx -t, then reload DEV only.
