<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #eef2f6; border-radius: 8px; }
    .header { text-align: center; border-bottom: 2px solid #16a34a; padding-bottom: 15px; margin-bottom: 20px; }
    .header h2 { color: #16a34a; margin: 0; }
    .btn { display: inline-block; background: #ee5e42; color: #fff; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-weight: 700; margin-top: 16px; }
    .footer { font-size: 12px; color: #94a3b8; margin-top: 30px; text-align: center; border-top: 1px solid #eef2f6; padding-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Welcome Back!</h2>
    </div>
    <p>Hello {{name}},</p>
    <p>Good news — your <strong>SAP Security Expert</strong> contributor profile has been reactivated. You're visible on the site again and can resume publishing articles.</p>

    <a href="{{login_url}}" class="btn">Sign In</a>

    <div class="footer">
      &copy; {{year}} SAP Security Expert. The leading community for SAP Security Professionals.<br>
      <a href="{{site_url}}" style="color: #94a3b8;">{{site_domain}}</a>
    </div>
  </div>
</body>
</html>
